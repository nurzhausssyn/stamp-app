<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Штамп</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #111111;
  --surface: #1c1c1c;
  --card:    #232323;
  --card2:   #2a2a2a;
  --lime:    #cef139;
  --lime-dim:#a8c82e;
  --text:    #f0f0f0;
  --muted:   #6a6a6a;
  --muted2:  #444444;
  --danger:  #ff4d4d;
  --r:       14px;
  --r-sm:    9px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
body { font-family: 'DM Sans', sans-serif; color: var(--text); }

/* ══════════════════════════════════════
   LAYOUT
══════════════════════════════════════ */
.app { display: flex; height: 100vh; }

/* ── SIDEBAR ─────────────────────────── */
.panel {
  width: 300px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid #2a2a2a;
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 24px 18px; gap: 20px;
  scrollbar-width: thin; scrollbar-color: var(--muted2) transparent;
}
.panel::-webkit-scrollbar { width: 4px; }
.panel::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 4px; }

.wordmark { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
.wordmark span { color: var(--lime); }

.section-title {
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 8px;
}

/* Drop zone */
.drop-zone {
  border: 1.5px dashed var(--muted2); border-radius: var(--r);
  padding: 20px 14px; text-align: center; cursor: pointer;
  transition: border-color 0.2s, background 0.2s; position: relative;
  background: var(--card);
}
.drop-zone:hover, .drop-zone.dragover { border-color: var(--lime); background: #1e2310; }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-icon {
  width: 36px; height: 36px; background: var(--card2); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
}
.drop-icon svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 1.8; }
.drop-text { font-size: 12px; color: var(--muted); line-height: 1.5; }
.drop-text b { color: var(--lime); font-weight: 600; }
.fname { margin-top: 8px; font-size: 11px; color: var(--lime); font-weight: 600; display: none; word-break: break-all; font-family: 'DM Mono', monospace; }

/* Stamp grid */
.stamps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stamp-opt input { display: none; }
.stamp-card {
  border: 1.5px solid var(--muted2); border-radius: var(--r-sm);
  padding: 8px 5px; text-align: center; cursor: pointer;
  transition: border-color 0.18s, background 0.18s; background: var(--card);
}
.stamp-card:hover { border-color: #555; background: var(--card2); }
.stamp-opt input:checked + .stamp-card {
  border-color: var(--lime); background: #1e2310;
}
.stamp-card img { width: 100%; height: 38px; object-fit: contain; border-radius: 5px; background: #2e2e2e; }
.stamp-card .nm { font-size: 9px; color: var(--muted); margin-top: 5px; font-weight: 600; line-height: 1.3; }

/* Slider */
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] {
  flex: 1; -webkit-appearance: none; height: 3px;
  background: linear-gradient(to right, var(--lime) var(--pct,40%), var(--muted2) var(--pct,40%));
  border-radius: 3px; outline: none; cursor: pointer;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  background: var(--lime); border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 0 3px rgba(206,241,57,0.15);
}
.sval { font-size: 12px; color: var(--lime); font-weight: 600; min-width: 34px; text-align: right; font-family: 'DM Mono', monospace; }

/* Stamp list */
.stamp-list { display: flex; flex-direction: column; gap: 4px; max-height: 130px; overflow-y: auto; }
.stamp-item {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: var(--r-sm);
  padding: 7px 10px; font-size: 11px; cursor: pointer;
  border: 1px solid transparent; transition: border-color 0.15s;
}
.stamp-item:hover { border-color: var(--muted2); }
.stamp-item .pg {
  background: var(--lime); color: #111; border-radius: 5px;
  padding: 2px 6px; font-size: 10px; font-weight: 700; flex-shrink: 0; font-family: 'DM Mono', monospace;
}
.stamp-item .nm { flex: 1; color: var(--muted); font-size: 11px; }
.stamp-item .del-s { color: var(--muted2); font-size: 14px; cursor: pointer; transition: color 0.15s; padding: 0 2px; }
.stamp-item .del-s:hover { color: var(--danger); }
.empty-list { font-size: 11px; color: var(--muted2); text-align: center; padding: 10px; }

/* Buttons */
.btn {
  padding: 12px 16px; border: none; border-radius: var(--r);
  font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  font-family: inherit; transition: all 0.18s; letter-spacing: 0.1px;
}
.btn-primary { background: var(--lime); color: #111; }
.btn-primary:hover { background: #d8f84a; box-shadow: 0 4px 20px rgba(206,241,57,0.2); }
.btn-primary:disabled { background: var(--muted2); color: var(--muted); cursor: not-allowed; box-shadow: none; }
.btn-ghost { background: var(--card); color: var(--muted); border: 1px solid var(--muted2); }
.btn-ghost:hover { border-color: #555; color: var(--text); background: var(--card2); }
.btn-add { background: #1a2410; color: var(--lime); border: 1px solid #2d3d18; }
.btn-add:hover { background: #1e2d12; border-color: var(--lime-dim); }
.btn-add:disabled { background: var(--card); color: var(--muted2); border-color: var(--muted2); cursor: not-allowed; }

/* Status */
.status { font-size: 12px; padding: 10px 12px; border-radius: var(--r-sm); display: none; font-weight: 500; }
.status.error { display: block; background: #2a1212; color: var(--danger); border: 1px solid #3d1a1a; }
.status.success { display: flex; align-items: center; gap: 6px; background: #1a2410; color: var(--lime); border: 1px solid #2d3d18; }
.status.loading { display: flex; align-items: center; gap: 6px; background: var(--card); color: var(--muted); border: 1px solid var(--muted2); }
.spinner { width: 13px; height: 13px; border: 2px solid var(--muted2); border-top-color: var(--lime); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Divider */
.divider { height: 1px; background: var(--muted2); opacity: 0.4; }

/* ══════════════════════════════════════
   PREVIEW
══════════════════════════════════════ */
.preview-area {
  flex: 1; display: flex; flex-direction: column;
  background: var(--bg); overflow: hidden;
}

.page-bar {
  display: none; align-items: center; background: var(--surface);
  border-bottom: 1px solid #2a2a2a; padding: 10px 20px; gap: 12px; flex-shrink: 0;
}
.nav-btn {
  background: var(--card); border: 1px solid var(--muted2); color: var(--text);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  font-family: inherit;
}
.nav-btn:hover { border-color: #555; background: var(--card2); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.page-info { color: var(--muted); font-size: 12px; font-weight: 600; flex: 1; text-align: center; font-family: 'DM Mono', monospace; }
.del-page-btn {
  background: #2a1212; color: var(--danger); border: 1px solid #3d1a1a;
  padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s;
}
.del-page-btn:hover { background: #3d1a1a; }
.restore-btn {
  background: #1a2410; color: var(--lime); border: 1px solid #2d3d18;
  padding: 7px 14px; border-radius: 8px; font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s;
}

.preview-scroll {
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  padding: 28px; overflow: auto; width: 100%;
}

.placeholder { text-align: center; color: var(--muted2); margin: auto; }
.placeholder .ico {
  width: 64px; height: 64px; background: var(--card); border-radius: 18px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  border: 1px solid var(--muted2);
}
.placeholder .ico svg { width: 28px; height: 28px; stroke: var(--muted); fill: none; stroke-width: 1.5; }
.placeholder p { font-size: 14px; color: var(--muted); line-height: 1.6; font-weight: 400; }

.preview-wrapper {
  position: relative; display: none; flex-shrink: 0;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
  border-radius: 2px;
}
.deleted-overlay {
  position: absolute; inset: 0; background: rgba(255,77,77,0.08);
  display: none; align-items: center; justify-content: center;
  pointer-events: none; z-index: 5;
}
.deleted-overlay .del-label {
  background: var(--danger); color: white; font-size: 16px; font-weight: 700;
  padding: 8px 20px; border-radius: 8px; letter-spacing: 3px;
  transform: rotate(-12deg); font-family: 'DM Mono', monospace;
}
#pdfCanvas { display: block; border-radius: 2px; }

.stamp-el {
  position: absolute; cursor: grab; user-select: none;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); touch-action: none;
}
.stamp-el:active { cursor: grabbing; }
.stamp-el img { width: 100%; height: 100%; pointer-events: none; display: block; }
.stamp-el .remove-stamp {
  position: absolute; top: -9px; right: -9px;
  background: var(--danger); color: white; border: 2px solid var(--bg);
  border-radius: 50%; width: 20px; height: 20px; font-size: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-family: inherit;
}

/* ══════════════════════════════════════
   MOBILE  ≤ 680px
══════════════════════════════════════ */
@media (max-width: 680px) {
  .app { flex-direction: column; }
  .preview-area { flex: 1; min-height: 0; }
  .preview-scroll { padding: 12px; }

  .panel {
    width: 100%; flex-shrink: 0; border-right: none;
    border-top: 1px solid var(--muted2);
    padding: 0; gap: 0; overflow: visible;
    max-height: 56px;
    transition: max-height 0.32s cubic-bezier(0.4,0,0.2,1);
    border-radius: 20px 20px 0 0;
  }

  .sheet-handle {
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 16px 0; cursor: pointer; flex-shrink: 0;
  }
  .pill { width: 32px; height: 3px; background: var(--muted2); border-radius: 3px; margin-bottom: 10px; }

  .quick-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px 12px; flex-shrink: 0;
  }
  .quick-title { flex: 1; font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quick-btn {
    background: var(--card); border: 1px solid var(--muted2); color: var(--muted);
    padding: 8px 12px; border-radius: 9px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s;
  }
  .quick-btn.accent { background: var(--lime); color: #111; border-color: var(--lime); }
  .quick-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .sheet-content {
    overflow-y: auto; padding: 4px 16px 24px;
    display: flex; flex-direction: column; gap: 14px;
    flex: 1; min-height: 0;
  }
  .desktop-only { display: none !important; }
}
@media (min-width: 681px) {
  .mobile-only { display: none !important; }
  .sheet-handle { display: none; }
  .quick-bar { display: none; }
  .sheet-content { display: contents; }
}
</style>
</head>
<body>
<div class="app">

<!-- ══ PREVIEW ══ -->
<div class="preview-area">
  <div class="page-bar" id="pageBar">
    <button class="nav-btn" id="prevBtn" onclick="goPage(-1)">‹</button>
    <div class="page-info" id="pageInfo">1 / 1</div>
    <button class="nav-btn" id="nextBtn" onclick="goPage(1)">›</button>
    <div style="flex:1"></div>
    <button class="del-page-btn" id="delPageBtn" onclick="toggleDeletePage()">Удалить страницу</button>
  </div>

  <div class="preview-scroll" id="previewScroll">
    <div class="placeholder" id="placeholder">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <p>Загрузите документ —<br>превью появится здесь</p>
    </div>
    <div class="preview-wrapper" id="previewWrapper">
      <canvas id="pdfCanvas"></canvas>
      <div class="deleted-overlay" id="deletedOverlay">
        <div class="del-label">УДАЛЕНО</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ PANEL ══ -->
<div class="panel" id="panel">

  <!-- Mobile handle -->
  <div class="sheet-handle" onclick="toggleSheet()">
    <div class="pill"></div>
    <div class="quick-bar" style="width:100%;padding:0 0 0">
      <div class="quick-title" id="mobileTitle">Загрузите файл</div>
      <button class="quick-btn" onclick="event.stopPropagation();document.getElementById('fileInputMobile').click()">Файл</button>
      <button class="quick-btn" id="mobileAddBtn" onclick="event.stopPropagation();addStampToPage()" disabled>+ Печать</button>
      <button class="quick-btn accent" id="mobileApplyBtn" onclick="event.stopPropagation();applyAll()" disabled>Скачать</button>
    </div>
  </div>
  <input type="file" id="fileInputMobile" accept=".docx" class="mobile-only" style="display:none">

  <!-- Sheet content -->
  <div class="sheet-content">

    <div class="wordmark desktop-only">Stamp<span>.</span></div>

    <!-- Desktop upload -->
    <div class="desktop-only">
      <div class="section-title">Документ</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".docx">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="drop-text">Перетащите или <b>выберите .docx</b></div>
        <div class="fname" id="fileName"></div>
      </div>
    </div>

    <div class="divider desktop-only"></div>

    <!-- Stamp selection -->
    <div>
      <div class="section-title">Печать</div>
      <div class="stamps-grid">
        {% for key, stamp in stamps.items() %}
        <label class="stamp-opt">
          <input type="radio" name="stamp" value="{{ key }}" {% if loop.first %}checked{% endif %}>
          <div class="stamp-card">
            <img src="/stamp_image/{{ key }}" alt="{{ stamp.label }}">
            <div class="nm">{{ stamp.label }}</div>
          </div>
        </label>
        {% endfor %}
      </div>
    </div>

    <div class="divider"></div>

    <!-- Size -->
    <div>
      <div class="section-title">Размер</div>
      <div class="slider-row">
        <input type="range" id="sizeSlider" min="8" max="40" value="20" oninput="onSizeChange(this.value)">
        <span class="sval" id="sizeVal">20%</span>
      </div>
    </div>

    <!-- Add stamp (desktop) -->
    <button class="btn btn-add desktop-only" id="addStampBtn" onclick="addStampToPage()" disabled>
      + Добавить печать на страницу
    </button>

    <div class="divider"></div>

    <!-- Stamp list -->
    <div>
      <div class="section-title">Добавленные печати</div>
      <div class="stamp-list" id="stampList">
        <div class="empty-list">Нет печатей</div>
      </div>
    </div>

    <div id="statusEl" class="status"></div>

    <!-- Desktop actions -->
    <div class="desktop-only" style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-primary" id="applyBtn" onclick="applyAll()" disabled>Скачать PDF</button>
      <button class="btn btn-ghost" id="resetBtn" onclick="resetAll()" style="display:none">Загрузить другой файл</button>
    </div>

  </div>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const isMobile = () => window.innerWidth <= 680;

let jobId = null, currentFilename = '', pdfDoc = null;
let currentPage = 1, totalPages = 0;
let deletedPages = new Set();
let stampsList = [], stampIdCounter = 0;
let pageWidth = 0, pageHeight = 0, renderScale = 1;
let sheetExpanded = false;

const $ = id => document.getElementById(id);
const fileInput = $('fileInput');
const fileInputMobile = $('fileInputMobile');
const dropZone = $('dropZone');
const fileName = $('fileName');
const placeholder = $('placeholder');
const previewWrapper = $('previewWrapper');
const pdfCanvas = $('pdfCanvas');
const pageBar = $('pageBar');
const pageInfo = $('pageInfo');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const delPageBtn = $('delPageBtn');
const deletedOverlay = $('deletedOverlay');
const addStampBtn = $('addStampBtn');
const stampListEl = $('stampList');
const applyBtn = $('applyBtn');
const resetBtn = $('resetBtn');
const statusEl = $('statusEl');
const mobileTitle = $('mobileTitle');
const mobileAddBtn = $('mobileAddBtn');
const mobileApplyBtn = $('mobileApplyBtn');
const panel = $('panel');

function toggleSheet() {
  if (!isMobile()) return;
  sheetExpanded = !sheetExpanded;
  panel.style.maxHeight = sheetExpanded ? '72vh' : '56px';
}
if (isMobile()) panel.style.maxHeight = '56px';

fileInput && fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
fileInputMobile && fileInputMobile.addEventListener('change', () => { if (fileInputMobile.files[0]) handleFile(fileInputMobile.files[0]); });

if (dropZone) {
  ['dragover','dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, e => {
      e.preventDefault();
      if (evt === 'dragover') dropZone.classList.add('dragover');
      else dropZone.classList.remove('dragover');
      if (evt === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  });
}

async function handleFile(file) {
  if (!file.name.endsWith('.docx')) { showStatus('error', 'Нужен файл .docx'); return; }
  currentFilename = file.name.replace('.docx', '');
  if (fileName) { fileName.textContent = file.name; fileName.style.display = 'block'; }
  if (mobileTitle) mobileTitle.textContent = file.name.slice(0, 20) + (file.name.length > 20 ? '…' : '');
  showStatus('loading', 'Конвертирую...');
  setControlsDisabled(true);

  const fd = new FormData();
  fd.append('docx', file);
  try {
    const resp = await fetch('/convert', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error);
    jobId = data.job_id;
    totalPages = data.page_count;
    currentPage = 1;
    deletedPages = new Set();
    stampsList.forEach(s => s.el.remove()); stampsList = [];
    showStatus('', '');
    pdfDoc = null;
    await renderPage(currentPage);
    pageBar.style.display = 'flex';
    placeholder.style.display = 'none';
    previewWrapper.style.display = 'block';
    setControlsDisabled(false);
    if (resetBtn) resetBtn.style.display = 'block';
    updatePageUI(); renderStampList();
    if (isMobile()) { sheetExpanded = false; panel.style.maxHeight = '56px'; }
  } catch(e) { showStatus('error', e.message); setControlsDisabled(false); }
}

function setControlsDisabled(d) {
  const dis = d || !jobId;
  [applyBtn, addStampBtn, mobileApplyBtn, mobileAddBtn].forEach(el => { if (el) el.disabled = dis; });
}

async function renderPage(num) {
  if (!pdfDoc) pdfDoc = await pdfjsLib.getDocument(`/preview_pdf/${jobId}`).promise;
  const page = await pdfDoc.getPage(num);
  const vp = page.getViewport({ scale: 1 });
  pageWidth = vp.width; pageHeight = vp.height;

  const scroll = $('previewScroll');
  const avW = scroll.clientWidth - (isMobile() ? 24 : 56);
  const avH = scroll.clientHeight - (isMobile() ? 24 : 56);
  renderScale = Math.min(avW / pageWidth, avH / pageHeight, isMobile() ? 2 : 1.8);

  const scaledVp = page.getViewport({ scale: renderScale });
  pdfCanvas.width = scaledVp.width;
  pdfCanvas.height = scaledVp.height;
  await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport: scaledVp }).promise;

  deletedOverlay.style.display = deletedPages.has(num) ? 'flex' : 'none';
  refreshStampsOnCanvas();
}

function updatePageUI() {
  pageInfo.textContent = `${currentPage} / ${totalPages}`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
  const isDel = deletedPages.has(currentPage);
  delPageBtn.textContent = isDel ? 'Восстановить' : 'Удалить страницу';
  delPageBtn.className = isDel ? 'restore-btn' : 'del-page-btn';
}

async function goPage(dir) {
  const next = currentPage + dir;
  if (next < 1 || next > totalPages) return;
  currentPage = next; updatePageUI(); await renderPage(currentPage);
}

function toggleDeletePage() {
  if (deletedPages.has(currentPage)) deletedPages.delete(currentPage);
  else deletedPages.add(currentPage);
  updatePageUI();
  deletedOverlay.style.display = deletedPages.has(currentPage) ? 'flex' : 'none';
  renderStampList();
}

function getSelectedStamp() { return document.querySelector('input[name=stamp]:checked').value; }

function onSizeChange(val) {
  $('sizeVal').textContent = val + '%';
  const size = parseFloat(val);
  const cw = pdfCanvas.clientWidth || pdfCanvas.width;
  stampsList.filter(s => s.page === currentPage).forEach(s => {
    s.el.style.width = (cw * size / 100) + 'px';
    s.size = size;
  });
  const slider = $('sizeSlider');
  const pct = ((val - slider.min) / (slider.max - slider.min) * 100).toFixed(1);
  slider.style.setProperty('--pct', pct + '%');
}

function addStampToPage() {
  if (!jobId) return;
  const stampKey = getSelectedStamp();
  const size = parseFloat($('sizeSlider').value);
  const id = ++stampIdCounter;
  const cw = pdfCanvas.clientWidth || pdfCanvas.width;
  const ch = pdfCanvas.clientHeight || pdfCanvas.height;
  const stampPxW = cw * (size / 100);

  const el = createStampEl(id, stampKey, stampPxW);
  previewWrapper.appendChild(el);
  el.style.left = ((cw - stampPxW) / 2) + 'px';
  el.style.top = (ch * 0.68) + 'px';

  stampsList.push({ id, page: currentPage, stamp: stampKey, el, size });
  refreshStampsOnCanvas(); renderStampList();
  if (isMobile()) { sheetExpanded = false; panel.style.maxHeight = '56px'; }
}

function createStampEl(id, stampKey, stampPxW) {
  const el = document.createElement('div');
  el.className = 'stamp-el';
  el.dataset.id = id;
  el.style.cssText = `width:${stampPxW}px;height:auto;display:block;`;
  const img = document.createElement('img');
  img.src = `/stamp_image/${stampKey}?t=${Date.now()}`;
  el.appendChild(img);
  const rm = document.createElement('button');
  rm.className = 'remove-stamp'; rm.innerHTML = '✕';
  rm.addEventListener('click', e => { e.stopPropagation(); removeStamp(id); });
  el.appendChild(rm);
  makeDraggable(el);
  return el;
}

function removeStamp(id) {
  const idx = stampsList.findIndex(s => s.id === id);
  if (idx === -1) return;
  stampsList[idx].el.remove(); stampsList.splice(idx, 1); renderStampList();
}

function refreshStampsOnCanvas() {
  stampsList.forEach(s => { s.el.style.display = s.page === currentPage ? 'block' : 'none'; });
}

function renderStampList() {
  const LABELS = { {% for key, stamp in stamps.items() %}'{{ key }}': '{{ stamp.label }}',{% endfor %} };
  if (!stampsList.length) { stampListEl.innerHTML = '<div class="empty-list">Нет печатей</div>'; return; }
  stampListEl.innerHTML = '';
  stampsList.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stamp-item';
    const isDel = deletedPages.has(s.page);
    div.innerHTML = `<span class="pg">${s.page}</span><span class="nm" style="${isDel?'text-decoration:line-through;opacity:0.4':''}">${LABELS[s.stamp]||s.stamp}</span><span class="del-s">✕</span>`;
    div.querySelector('.del-s').addEventListener('click', e => { e.stopPropagation(); removeStamp(s.id); });
    div.addEventListener('click', () => goToPage(s.page));
    stampListEl.appendChild(div);
  });
}

async function goToPage(num) {
  if (num === currentPage) return;
  currentPage = num; updatePageUI(); await renderPage(currentPage);
}

function makeDraggable(el) {
  let dragging = false, ox = 0, oy = 0;
  const start = (cx, cy) => { dragging = true; const r = el.getBoundingClientRect(); ox = cx - r.left; oy = cy - r.top; };
  const move = (cx, cy) => {
    if (!dragging) return;
    const wr = previewWrapper.getBoundingClientRect();
    let x = Math.max(0, Math.min(cx - wr.left - ox, wr.width - el.offsetWidth));
    let y = Math.max(0, Math.min(cy - wr.top - oy, wr.height - el.offsetHeight));
    el.style.left = x + 'px'; el.style.top = y + 'px';
  };
  el.addEventListener('mousedown', e => { if (e.target.classList.contains('remove-stamp')) return; start(e.clientX, e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  document.addEventListener('mouseup', () => { dragging = false; });
  el.addEventListener('touchstart', e => { if (e.target.classList.contains('remove-stamp')) return; const t = e.touches[0]; start(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', e => { if (!dragging) return; move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });
  document.addEventListener('touchend', () => { dragging = false; });
}

async function applyAll() {
  if (!jobId) return;
  const canvasRect = pdfCanvas.getBoundingClientRect();
  const cw = canvasRect.width, ch = canvasRect.height;
  const stampsData = stampsList.map(s => {
    const sr = s.el.getBoundingClientRect();
    return { page: s.page, stamp: s.stamp, x: ((sr.left - canvasRect.left) / cw) * 100, y: ((sr.top - canvasRect.top) / ch) * 100, size: s.size };
  });
  showStatus('loading', 'Генерирую PDF...');
  if (applyBtn) applyBtn.disabled = true;
  if (mobileApplyBtn) mobileApplyBtn.disabled = true;
  try {
    const resp = await fetch('/process', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: jobId, stamps: stampsData, deleted_pages: Array.from(deletedPages), filename: currentFilename })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error);
    const a = document.createElement('a');
    a.href = data.download_url; a.download = currentFilename + '_с_печатью.pdf'; a.click();
    showStatus('success', 'PDF скачивается');
  } catch(e) { showStatus('error', e.message); }
  finally { if (applyBtn) applyBtn.disabled = false; if (mobileApplyBtn) mobileApplyBtn.disabled = false; }
}

function resetAll() {
  jobId = null; currentFilename = ''; pdfDoc = null;
  currentPage = 1; totalPages = 0; deletedPages = new Set();
  stampsList.forEach(s => s.el.remove()); stampsList = [];
  if (fileInput) fileInput.value = '';
  if (fileInputMobile) fileInputMobile.value = '';
  if (fileName) fileName.style.display = 'none';
  if (mobileTitle) mobileTitle.textContent = 'Загрузите файл';
  placeholder.style.display = 'block';
  previewWrapper.style.display = 'none';
  pageBar.style.display = 'none';
  setControlsDisabled(true);
  if (resetBtn) resetBtn.style.display = 'none';
  showStatus('', ''); renderStampList();
}

function showStatus(type, msg) {
  statusEl.className = 'status'; statusEl.innerHTML = '';
  if (!type || !msg) { statusEl.style.display = 'none'; return; }
  statusEl.classList.add(type);
  if (type === 'loading') { statusEl.innerHTML = `<div class="spinner"></div><span>${msg}</span>`; statusEl.style.display = 'flex'; }
  else { statusEl.textContent = msg; statusEl.style.display = type === 'success' ? 'flex' : 'block'; }
}

onSizeChange(20);
</script>
