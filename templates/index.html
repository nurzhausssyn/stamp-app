<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Штамп на документ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #4361ee;
  --blue-light: #eef0ff;
  --green: #2ec4b6;
  --red: #e63946;
  --bg: #f0f2f9;
  --card: #ffffff;
  --text: #1a1a2e;
  --muted: #9098b1;
  --radius: 14px;
  --panel-h: 52px; /* collapsed mobile panel height */
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); }

/* ═══════════════════════════════════════
   DESKTOP: side-by-side layout
═══════════════════════════════════════ */
.app { display: flex; height: 100vh; }

.panel {
  width: 290px; flex-shrink: 0;
  background: var(--card);
  box-shadow: 2px 0 20px rgba(67,97,238,0.08);
  display: flex; flex-direction: column;
  overflow-y: auto; padding: 20px 16px; gap: 14px;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 8px; }
.brand-icon { width: 36px; height: 36px; background: var(--blue); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.brand-text h1 { font-size: 15px; font-weight: 800; color: var(--text); }
.brand-text p { font-size: 11px; color: var(--muted); margin-top: 1px; }

.lbl { font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

/* Drop zone */
.drop-zone {
  border: 2px dashed #d5d9ee; border-radius: var(--radius); padding: 16px 12px;
  text-align: center; cursor: pointer; transition: all 0.2s; position: relative; background: #fafbff;
}
.drop-zone.dragover, .drop-zone:hover { border-color: var(--blue); background: var(--blue-light); }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-icon { font-size: 26px; }
.drop-text { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
.drop-text b { color: var(--blue); }
.fname { margin-top: 7px; font-size: 11px; color: var(--green); font-weight: 700; display: none; word-break: break-all; }

/* Stamps */
.stamps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stamp-opt input { display: none; }
.stamp-card {
  border: 2px solid #e8ecf5; border-radius: 10px; padding: 6px 4px;
  text-align: center; cursor: pointer; transition: all 0.18s; background: #fafbff;
}
.stamp-card:hover { border-color: #b0bcff; }
.stamp-opt input:checked + .stamp-card { border-color: var(--blue); background: var(--blue-light); box-shadow: 0 0 0 3px rgba(67,97,238,0.12); }
.stamp-card img { width: 100%; height: 38px; object-fit: contain; background: #f4f5f8; border-radius: 5px; }
.stamp-card .nm { font-size: 9px; color: var(--muted); margin-top: 3px; font-weight: 700; line-height: 1.2; }

/* Slider */
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row input[type=range] {
  flex: 1; -webkit-appearance: none; height: 4px;
  background: linear-gradient(to right, var(--blue) 0%, var(--blue) var(--pct, 40%), #dde2f0 var(--pct, 40%));
  border-radius: 4px; outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  background: var(--blue); border-radius: 50%; cursor: pointer;
  box-shadow: 0 2px 6px rgba(67,97,238,0.35);
}
.sval { font-size: 12px; color: var(--blue); font-weight: 800; min-width: 32px; text-align: right; }

/* Stamp list */
.stamp-list { display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
.stamp-item {
  display: flex; align-items: center; gap: 6px;
  background: var(--blue-light); border-radius: 8px; padding: 5px 8px; font-size: 11px; cursor: pointer;
}
.stamp-item:hover { background: #e2e6ff; }
.stamp-item .pg { background: var(--blue); color: white; border-radius: 5px; padding: 1px 5px; font-size: 10px; font-weight: 800; flex-shrink: 0; }
.stamp-item .del-s { margin-left: auto; color: var(--red); font-size: 15px; cursor: pointer; padding: 0 2px; }
.empty-list { font-size: 11px; color: #c5c9d8; text-align: center; padding: 8px; }

/* Buttons */
.btn {
  padding: 12px; background: var(--blue); color: white; border: none;
  border-radius: var(--radius); font-size: 14px; font-weight: 800; cursor: pointer; width: 100%;
  font-family: inherit; transition: all 0.18s; letter-spacing: 0.2px;
}
.btn:hover { background: #3451d1; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(67,97,238,0.3); }
.btn:disabled { background: #c5c9d8; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-outline {
  padding: 10px; background: transparent; color: var(--blue); border: 2px solid var(--blue);
  border-radius: var(--radius); font-size: 13px; font-weight: 700; cursor: pointer; width: 100%;
  font-family: inherit; transition: all 0.18s;
}
.btn-outline:hover { background: var(--blue-light); }
.btn-green {
  padding: 10px; background: #edfdf9; color: #0d9488; border: 2px solid #99f6e4;
  border-radius: var(--radius); font-size: 13px; font-weight: 700; cursor: pointer; width: 100%;
  font-family: inherit; transition: all 0.18s;
}
.btn-green:hover { background: #ccfbf1; }
.btn-green:disabled { background: #f0f0f4; color: #c5c9d8; border-color: #e8e8ef; cursor: not-allowed; }

/* Status */
.status { font-size: 12px; padding: 9px 12px; border-radius: 10px; display: none; font-weight: 600; }
.status.error { display: block; background: #fff0f0; color: var(--red); }
.status.success { display: flex; align-items: center; gap: 6px; background: #edfdf9; color: #0d9488; }
.status.loading { display: flex; align-items: center; gap: 6px; background: var(--blue-light); color: var(--blue); }
.spinner { width: 14px; height: 14px; border: 2px solid #c0c8f8; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════
   PREVIEW AREA
═══════════════════════════════════════ */
.preview-area {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; background: var(--bg); overflow: hidden; position: relative;
}

/* Top nav bar */
.page-bar {
  width: 100%; background: #1e2340; display: none;
  align-items: center; justify-content: center; flex-shrink: 0; z-index: 5;
}
.page-bar-inner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; width: 100%; max-width: 700px; }
.nav-btn {
  background: rgba(255,255,255,0.12); border: none; color: white;
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit;
  transition: background 0.15s;
}
.nav-btn:hover { background: rgba(255,255,255,0.22); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.page-info { color: white; font-size: 13px; font-weight: 700; flex: 1; text-align: center; }
.del-page-btn {
  background: var(--red); border: none; color: white; padding: 6px 12px;
  border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit;
  white-space: nowrap; transition: background 0.15s;
}
.del-page-btn:hover { background: #c1121f; }
.restore-btn {
  background: var(--green); border: none; color: white; padding: 6px 12px;
  border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; font-family: inherit;
  white-space: nowrap;
}

.preview-scroll {
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  padding: 20px; overflow: auto; width: 100%;
}

.placeholder { text-align: center; color: #b8bdd4; margin: auto; }
.placeholder .ico { font-size: 52px; margin-bottom: 12px; }
.placeholder p { font-size: 14px; font-weight: 600; line-height: 1.6; }

.preview-wrapper {
  position: relative; display: none;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18); flex-shrink: 0;
}
.deleted-overlay {
  position: absolute; inset: 0; background: rgba(230,57,70,0.15);
  display: none; align-items: center; justify-content: center;
  pointer-events: none; z-index: 5;
}
.deleted-overlay .del-label {
  background: var(--red); color: white; font-size: 20px; font-weight: 800;
  padding: 8px 20px; border-radius: 10px; letter-spacing: 2px;
  transform: rotate(-12deg); font-family: inherit;
}
#pdfCanvas { display: block; }

.stamp-el {
  position: absolute; cursor: grab; user-select: none;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.25)); touch-action: none;
}
.stamp-el:active { cursor: grabbing; }
.stamp-el img { width: 100%; height: 100%; pointer-events: none; display: block; }
.stamp-el .remove-stamp {
  position: absolute; top: -10px; right: -10px; background: var(--red);
  color: white; border: 2px solid white; border-radius: 50%; width: 22px; height: 22px;
  font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-family: inherit; flex-shrink: 0;
}

/* ═══════════════════════════════════════
   MOBILE LAYOUT  (≤ 680px)
═══════════════════════════════════════ */
@media (max-width: 680px) {
  .app { flex-direction: column; }

  /* Preview takes top portion */
  .preview-area {
    flex: 1; min-height: 0;
  }

  .preview-scroll { padding: 10px; align-items: center; }

  /* Bottom sheet panel */
  .panel {
    width: 100%; flex-shrink: 0;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px rgba(67,97,238,0.13);
    padding: 0; gap: 0; overflow: visible;
    /* collapsed height = handle + quick actions */
    height: auto; max-height: 70vh;
    display: flex; flex-direction: column;
    transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  /* Drag handle */
  .sheet-handle {
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 16px 0; cursor: pointer; flex-shrink: 0;
  }
  .sheet-handle .pill {
    width: 38px; height: 4px; background: #d5d9ee; border-radius: 4px; margin-bottom: 10px;
  }

  /* Quick bar always visible */
  .quick-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px 10px; flex-shrink: 0;
  }
  .quick-bar .btn { font-size: 13px; padding: 10px; }

  /* Scrollable content inside sheet */
  .sheet-content {
    overflow-y: auto; padding: 4px 14px 20px;
    display: flex; flex-direction: column; gap: 12px;
    flex: 1; min-height: 0;
  }

  /* Desktop-only elements hidden on mobile */
  .desktop-only { display: none !important; }

  /* Page bar smaller on mobile */
  .page-bar-inner { padding: 6px 10px; gap: 6px; }
  .page-info { font-size: 12px; }
  .del-page-btn, .restore-btn { font-size: 10px; padding: 5px 8px; }
}

/* Desktop: hide mobile-only elements */
@media (min-width: 681px) {
  .mobile-only { display: none !important; }
  .sheet-handle { display: none; }
  .quick-bar { display: none; }
  .sheet-content { display: contents; }
}
</style>
</head>
<body>
<div class="app">

<!-- ═══ PREVIEW (top on mobile, right on desktop) ═══ -->
<div class="preview-area">
  <div class="page-bar" id="pageBar">
    <div class="page-bar-inner">
      <button class="nav-btn" id="prevBtn" onclick="goPage(-1)">‹</button>
      <div class="page-info" id="pageInfo">Стр 1 / 1</div>
      <button class="nav-btn" id="nextBtn" onclick="goPage(1)">›</button>
      <button class="del-page-btn" id="delPageBtn" onclick="toggleDeletePage()">🗑 Удалить</button>
    </div>
  </div>

  <div class="preview-scroll" id="previewScroll">
    <div class="placeholder" id="placeholder">
      <div class="ico">📋</div>
      <p>Загрузите документ —<br>увидите превью здесь</p>
    </div>
    <div class="preview-wrapper" id="previewWrapper">
      <canvas id="pdfCanvas"></canvas>
      <div class="deleted-overlay" id="deletedOverlay">
        <div class="del-label">УДАЛЕНО</div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ PANEL ═══ -->
<div class="panel" id="panel">

  <!-- Mobile: drag handle -->
  <div class="sheet-handle" onclick="toggleSheet()">
    <div class="pill"></div>
    <!-- Quick actions always visible on mobile -->
    <div class="quick-bar" style="width:100%;padding:0 0 10px">
      <div style="flex:1;font-size:13px;font-weight:800;color:var(--text)" id="mobileTitle">📄 Загрузите файл</div>
      <button class="btn" style="width:auto;padding:9px 14px;font-size:12px" onclick="event.stopPropagation();document.getElementById('fileInput').click()">📁 Файл</button>
      <button class="btn" style="width:auto;padding:9px 14px;font-size:12px;background:#edfdf9;color:#0d9488;border:2px solid #99f6e4" id="mobileAddBtn" onclick="event.stopPropagation();addStampToPage()" disabled>➕</button>
      <button class="btn" style="width:auto;padding:9px 14px;font-size:12px" id="mobileApplyBtn" onclick="event.stopPropagation();applyAll()" disabled>📥</button>
    </div>
  </div>

  <!-- Scrollable sheet content -->
  <div class="sheet-content">

    <!-- Brand (desktop only) -->
    <div class="brand desktop-only">
      <div class="brand-icon">🖊️</div>
      <div class="brand-text">
        <h1>Штамп на документ</h1>
        <p>Печати · Листалка · Удаление страниц</p>
      </div>
    </div>

    <!-- File upload (desktop) -->
    <div class="desktop-only">
      <div class="lbl">1. Документ</div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".docx">
        <div class="drop-icon">📁</div>
        <div class="drop-text">Перетащите или <b>выберите .docx</b></div>
        <div class="fname" id="fileName"></div>
      </div>
    </div>
    <!-- Mobile file input (hidden, triggered by button) -->
    <input type="file" id="fileInputMobile" accept=".docx" class="mobile-only" style="display:none">

    <!-- Stamp selection -->
    <div>
      <div class="lbl">Печать</div>
      <div class="stamps-grid">
        {% for key, stamp in stamps.items() %}
        <label class="stamp-opt">
          <input type="radio" name="stamp" value="{{ key }}" {% if loop.first %}checked{% endif %}>
          <div class="stamp-card">
            <img src="/stamp_image/{{ key }}" alt="{{ stamp.label }}">
            <div class="nm">{{ stamp.label }}</div>
          </div>
        </label>
        {% endfor %}
      </div>
    </div>

    <!-- Size -->
    <div>
      <div class="lbl">Размер печати</div>
      <div class="slider-row">
        <input type="range" id="sizeSlider" min="8" max="40" value="20" oninput="onSizeChange(this.value)">
        <span class="sval" id="sizeVal">20%</span>
      </div>
    </div>

    <!-- Add stamp button (desktop) -->
    <div class="desktop-only">
      <button class="btn-green" id="addStampBtn" onclick="addStampToPage()" disabled>
        ➕ Добавить печать на страницу
      </button>
    </div>

    <!-- Stamp list -->
    <div>
      <div class="lbl">Добавленные печати</div>
      <div class="stamp-list" id="stampList">
        <div class="empty-list">Нет печатей</div>
      </div>
    </div>

    <!-- Status -->
    <div id="statusEl" class="status"></div>

    <!-- Buttons (desktop) -->
    <div class="desktop-only" style="display:flex;flex-direction:column;gap:8px">
      <button class="btn" id="applyBtn" onclick="applyAll()" disabled>📥 Скачать PDF</button>
      <button class="btn-outline" id="resetBtn" onclick="resetAll()" style="display:none">🔄 Другой документ</button>
    </div>

  </div><!-- /sheet-content -->
</div><!-- /panel -->

</div><!-- /app -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const isMobile = () => window.innerWidth <= 680;

let jobId = null, currentFilename = '', pdfDoc = null;
let currentPage = 1, totalPages = 0;
let deletedPages = new Set();
let stampsList = [], stampIdCounter = 0;
let pageWidth = 0, pageHeight = 0, renderScale = 1;
let sheetExpanded = false;

// Elements
const fileInput = document.getElementById('fileInput');
const fileInputMobile = document.getElementById('fileInputMobile');
const dropZone = document.getElementById('dropZone');
const fileName = document.getElementById('fileName');
const placeholder = document.getElementById('placeholder');
const previewWrapper = document.getElementById('previewWrapper');
const pdfCanvas = document.getElementById('pdfCanvas');
const pageBar = document.getElementById('pageBar');
const pageInfo = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const delPageBtn = document.getElementById('delPageBtn');
const deletedOverlay = document.getElementById('deletedOverlay');
const addStampBtn = document.getElementById('addStampBtn');
const stampListEl = document.getElementById('stampList');
const applyBtn = document.getElementById('applyBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('statusEl');
const mobileTitle = document.getElementById('mobileTitle');
const mobileAddBtn = document.getElementById('mobileAddBtn');
const mobileApplyBtn = document.getElementById('mobileApplyBtn');
const panel = document.getElementById('panel');

// Mobile sheet toggle
function toggleSheet() {
  if (!isMobile()) return;
  sheetExpanded = !sheetExpanded;
  panel.style.maxHeight = sheetExpanded ? '70vh' : '160px';
}

// Init mobile sheet
if (isMobile()) panel.style.maxHeight = '160px';

// File inputs
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
fileInputMobile.addEventListener('change', () => { if (fileInputMobile.files[0]) handleFile(fileInputMobile.files[0]); });

// Mobile file button triggers correct input
document.querySelector('.sheet-handle .btn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (isMobile()) fileInputMobile.click();
  else fileInput.click();
});

// Desktop drop zone
if (dropZone) {
  ['dragover','dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, e => {
      e.preventDefault();
      if (evt === 'dragover') dropZone.classList.add('dragover');
      else dropZone.classList.remove('dragover');
      if (evt === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  });
}

async function handleFile(file) {
  if (!file.name.endsWith('.docx')) { showStatus('error', 'Нужен файл .docx'); return; }
  currentFilename = file.name.replace('.docx', '');
  if (fileName) { fileName.textContent = '✅ ' + file.name; fileName.style.display = 'block'; }
  if (mobileTitle) mobileTitle.textContent = '📄 ' + file.name.slice(0, 18) + (file.name.length > 18 ? '…' : '');
  showStatus('loading', 'Конвертирую документ...');
  setControlsDisabled(true);

  const fd = new FormData();
  fd.append('docx', file);
  try {
    const resp = await fetch('/convert', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error);
    jobId = data.job_id;
    totalPages = data.page_count;
    currentPage = 1;
    deletedPages = new Set();
    stampsList.forEach(s => s.el.remove());
    stampsList = [];
    showStatus('', '');
    pdfDoc = null;
    await renderPage(currentPage);
    pageBar.style.display = 'flex';
    placeholder.style.display = 'none';
    previewWrapper.style.display = 'block';
    setControlsDisabled(false);
    if (resetBtn) resetBtn.style.display = 'block';
    updatePageUI();
    renderStampList();
    // Auto-collapse sheet on mobile after load
    if (isMobile()) { sheetExpanded = false; panel.style.maxHeight = '160px'; }
  } catch(e) { showStatus('error', '❌ ' + e.message); setControlsDisabled(false); }
}

function setControlsDisabled(dis) {
  if (applyBtn) applyBtn.disabled = dis || !jobId;
  if (addStampBtn) addStampBtn.disabled = dis || !jobId;
  if (mobileApplyBtn) mobileApplyBtn.disabled = dis || !jobId;
  if (mobileAddBtn) mobileAddBtn.disabled = dis || !jobId;
}

async function renderPage(num) {
  if (!pdfDoc) pdfDoc = await pdfjsLib.getDocument(`/preview_pdf/${jobId}`).promise;
  const page = await pdfDoc.getPage(num);
  const vp = page.getViewport({ scale: 1 });
  pageWidth = vp.width; pageHeight = vp.height;

  const scroll = document.getElementById('previewScroll');
  const avW = scroll.clientWidth - (isMobile() ? 16 : 40);
  const avH = scroll.clientHeight - (isMobile() ? 16 : 40);
  renderScale = Math.min(avW / pageWidth, avH / pageHeight, isMobile() ? 2 : 1.8);

  const scaledVp = page.getViewport({ scale: renderScale });
  pdfCanvas.width = scaledVp.width;
  pdfCanvas.height = scaledVp.height;
  await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport: scaledVp }).promise;

  deletedOverlay.style.display = deletedPages.has(num) ? 'flex' : 'none';
  refreshStampsOnCanvas();
}

function updatePageUI() {
  pageInfo.textContent = `Стр ${currentPage} / ${totalPages}`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
  const isDel = deletedPages.has(currentPage);
  delPageBtn.textContent = isDel ? '↩ Вернуть' : '🗑 Удалить';
  delPageBtn.className = isDel ? 'restore-btn' : 'del-page-btn';
}

async function goPage(dir) {
  const next = currentPage + dir;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  updatePageUI();
  await renderPage(currentPage);
}

function toggleDeletePage() {
  if (deletedPages.has(currentPage)) deletedPages.delete(currentPage);
  else deletedPages.add(currentPage);
  updatePageUI();
  deletedOverlay.style.display = deletedPages.has(currentPage) ? 'flex' : 'none';
  renderStampList();
}

// ─── STAMPS ───────────────────────────────────────

function getSelectedStamp() { return document.querySelector('input[name=stamp]:checked').value; }

function onSizeChange(val) {
  document.getElementById('sizeVal').textContent = val + '%';
  const size = parseFloat(val);
  const cw = pdfCanvas.clientWidth || pdfCanvas.width;
  stampsList.filter(s => s.page === currentPage).forEach(s => {
    s.el.style.width = (cw * size / 100) + 'px';
    s.size = size;
  });
  // Update slider gradient
  const slider = document.getElementById('sizeSlider');
  const pct = ((val - slider.min) / (slider.max - slider.min) * 100).toFixed(1);
  slider.style.setProperty('--pct', pct + '%');
}

function addStampToPage() {
  if (!jobId) return;
  const stampKey = getSelectedStamp();
  const size = parseFloat(document.getElementById('sizeSlider').value);
  const id = ++stampIdCounter;
  const cw = pdfCanvas.clientWidth || pdfCanvas.width;
  const ch = pdfCanvas.clientHeight || pdfCanvas.height;
  const stampPxW = cw * (size / 100);

  const el = createStampEl(id, stampKey, stampPxW);
  previewWrapper.appendChild(el);

  el.style.left = ((cw - stampPxW) / 2) + 'px';
  el.style.top = (ch * 0.68) + 'px';

  stampsList.push({ id, page: currentPage, stamp: stampKey, el, size });
  refreshStampsOnCanvas();
  renderStampList();

  // Collapse sheet on mobile so user can see the stamp
  if (isMobile()) { sheetExpanded = false; panel.style.maxHeight = '160px'; }
}

function createStampEl(id, stampKey, stampPxW) {
  const el = document.createElement('div');
  el.className = 'stamp-el';
  el.dataset.id = id;
  el.style.cssText = `width:${stampPxW}px;height:auto;display:block;`;

  const img = document.createElement('img');
  img.src = `/stamp_image/${stampKey}?t=${Date.now()}`;
  el.appendChild(img);

  const rm = document.createElement('button');
  rm.className = 'remove-stamp';
  rm.innerHTML = '✕';
  rm.addEventListener('click', e => { e.stopPropagation(); removeStamp(id); });
  el.appendChild(rm);

  makeDraggable(el);
  return el;
}

function removeStamp(id) {
  const idx = stampsList.findIndex(s => s.id === id);
  if (idx === -1) return;
  stampsList[idx].el.remove();
  stampsList.splice(idx, 1);
  renderStampList();
}

function refreshStampsOnCanvas() {
  stampsList.forEach(s => { s.el.style.display = s.page === currentPage ? 'block' : 'none'; });
}

function renderStampList() {
  const LABELS = {
    {% for key, stamp in stamps.items() %}
    '{{ key }}': '{{ stamp.label }}',
    {% endfor %}
  };
  if (stampsList.length === 0) {
    stampListEl.innerHTML = '<div class="empty-list">Нет печатей</div>';
    return;
  }
  stampListEl.innerHTML = '';
  stampsList.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stamp-item';
    const isDel = deletedPages.has(s.page);
    div.innerHTML = `<span class="pg">стр ${s.page}</span>
      <span style="flex:1;font-size:11px;${isDel?'text-decoration:line-through;color:#c5c9d8':''}">${LABELS[s.stamp]||s.stamp}</span>
      <span class="del-s">✕</span>`;
    div.querySelector('.del-s').addEventListener('click', e => { e.stopPropagation(); removeStamp(s.id); });
    div.addEventListener('click', () => goToPage(s.page));
    stampListEl.appendChild(div);
  });
}

async function goToPage(num) {
  if (num === currentPage) return;
  currentPage = num; updatePageUI(); await renderPage(currentPage);
}

// ─── DRAG ─────────────────────────────────────────

function makeDraggable(el) {
  let dragging = false, ox = 0, oy = 0;

  function startDrag(cx, cy) {
    dragging = true;
    const r = el.getBoundingClientRect();
    ox = cx - r.left; oy = cy - r.top;
  }
  function moveDrag(cx, cy) {
    if (!dragging) return;
    const wr = previewWrapper.getBoundingClientRect();
    let x = cx - wr.left - ox;
    let y = cy - wr.top - oy;
    x = Math.max(0, Math.min(x, wr.width - el.offsetWidth));
    y = Math.max(0, Math.min(y, wr.height - el.offsetHeight));
    el.style.left = x + 'px'; el.style.top = y + 'px';
  }

  el.addEventListener('mousedown', e => { if (e.target.classList.contains('remove-stamp')) return; startDrag(e.clientX, e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', () => { dragging = false; });

  el.addEventListener('touchstart', e => {
    if (e.target.classList.contains('remove-stamp')) return;
    const t = e.touches[0]; startDrag(t.clientX, t.clientY); e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    moveDrag(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', () => { dragging = false; });
}

// ─── APPLY ────────────────────────────────────────

async function applyAll() {
  if (!jobId) return;
  const canvasRect = pdfCanvas.getBoundingClientRect();
  const cw = canvasRect.width, ch = canvasRect.height;

  const stampsData = stampsList.map(s => {
    const sr = s.el.getBoundingClientRect();
    return {
      page: s.page, stamp: s.stamp,
      x: ((sr.left - canvasRect.left) / cw) * 100,
      y: ((sr.top - canvasRect.top) / ch) * 100,
      size: s.size
    };
  });

  showStatus('loading', 'Генерирую PDF...');
  if (applyBtn) applyBtn.disabled = true;
  if (mobileApplyBtn) mobileApplyBtn.disabled = true;

  try {
    const resp = await fetch('/process', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: jobId, stamps: stampsData, deleted_pages: Array.from(deletedPages), filename: currentFilename })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error);
    const a = document.createElement('a');
    a.href = data.download_url; a.download = currentFilename + '_с_печатью.pdf'; a.click();
    showStatus('success', '✅ PDF скачивается!');
  } catch(e) {
    showStatus('error', '❌ ' + e.message);
  } finally {
    if (applyBtn) applyBtn.disabled = false;
    if (mobileApplyBtn) mobileApplyBtn.disabled = false;
  }
}

function resetAll() {
  jobId = null; currentFilename = ''; pdfDoc = null;
  currentPage = 1; totalPages = 0; deletedPages = new Set();
  stampsList.forEach(s => s.el.remove()); stampsList = [];
  fileInput.value = ''; fileInputMobile.value = '';
  if (fileName) fileName.style.display = 'none';
  if (mobileTitle) mobileTitle.textContent = '📄 Загрузите файл';
  placeholder.style.display = 'block';
  previewWrapper.style.display = 'none';
  pageBar.style.display = 'none';
  setControlsDisabled(true);
  if (resetBtn) resetBtn.style.display = 'none';
  showStatus('', '');
  renderStampList();
}

function showStatus(type, msg) {
  statusEl.className = 'status';
  statusEl.innerHTML = '';
  if (!type || !msg) { statusEl.style.display = 'none'; return; }
  statusEl.classList.add(type);
  if (type === 'loading') { statusEl.innerHTML = `<div class="spinner"></div><span>${msg}</span>`; statusEl.style.display = 'flex'; }
  else { statusEl.textContent = msg; statusEl.style.display = type === 'success' ? 'flex' : 'block'; }
}

// Init slider gradient
onSizeChange(20);
</script>
