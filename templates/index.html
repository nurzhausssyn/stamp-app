<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stamp</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #0a0a0a;
  --white: #f5f5f3;
  --gray1: #e8e8e6;
  --gray2: #c0c0be;
  --gray3: #888887;
  --gray4: #444443;
  --gray5: #222221;
  --line:  1px solid #2a2a28;
  --line-l: 1px solid #d8d8d6;
  --mono: 'DM Mono', monospace;
  --head: 'Unbounded', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--black); }
body { font-family: var(--mono); color: var(--white); }

/* ══════════════════════════
   GRID LAYOUT
══════════════════════════ */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 100vh;
  height: 100vh;
}

/* ══════════════════════════
   LEFT COLUMN
══════════════════════════ */
.panel {
  background: var(--black);
  border-right: var(--line);
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
.panel::-webkit-scrollbar { display: none; }

.panel-header {
  padding: 20px 20px 0;
  border-bottom: var(--line);
  padding-bottom: 20px;
  flex-shrink: 0;
}
.wordmark {
  font-family: var(--head);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--white);
}
.tagline {
  font-size: 9px;
  color: var(--gray3);
  margin-top: 3px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Sections */
.section {
  border-bottom: var(--line);
  padding: 16px 20px;
  flex-shrink: 0;
}
.section-label {
  font-size: 8px;
  font-weight: 500;
  color: var(--gray3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

/* Drop zone */
.drop-zone {
  border: var(--line);
  padding: 18px 14px;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.drop-zone:hover, .drop-zone.dragover { background: var(--gray5); }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-arrow {
  font-size: 20px; line-height: 1;
  font-family: var(--head); color: var(--gray3); margin-bottom: 8px;
}
.drop-text { font-size: 9px; color: var(--gray3); line-height: 1.6; letter-spacing: 0.05em; }
.drop-text b { color: var(--white); font-weight: 500; }
.fname {
  display: none; margin-top: 8px;
  font-size: 9px; color: var(--white);
  letter-spacing: 0.04em; word-break: break-all; line-height: 1.5;
}

/* Stamp grid */
.stamps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--gray4); border: var(--line); }
.stamp-opt input { display: none; }
.stamp-card {
  background: var(--black); padding: 8px 6px; text-align: center;
  cursor: pointer; transition: background 0.12s;
}
.stamp-card:hover { background: var(--gray5); }
.stamp-opt input:checked + .stamp-card { background: var(--white); }
.stamp-opt input:checked + .stamp-card .nm { color: var(--black); }
.stamp-card img { width: 100%; height: 36px; object-fit: contain; }
.stamp-card .nm {
  font-size: 7px; color: var(--gray3); margin-top: 5px;
  line-height: 1.3; letter-spacing: 0.04em; text-transform: uppercase;
}

/* Slider */
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] {
  flex: 1; -webkit-appearance: none; height: 1px;
  background: linear-gradient(to right, var(--white) var(--pct,40%), var(--gray4) var(--pct,40%));
  outline: none; cursor: pointer;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: var(--white); border-radius: 0; cursor: pointer;
}
.sval { font-size: 10px; color: var(--gray2); min-width: 30px; text-align: right; }

/* Stamp list */
.stamp-list { display: flex; flex-direction: column; gap: 0; }
.stamp-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: var(--line);
  font-size: 9px; cursor: pointer; transition: color 0.12s;
}
.stamp-item:last-child { border-bottom: none; }
.stamp-item:hover { color: var(--gray2); }
.stamp-item .pg {
  font-size: 8px; color: var(--gray3); min-width: 14px;
  font-weight: 500; letter-spacing: 0.05em;
}
.stamp-item .nm { flex: 1; color: var(--white); letter-spacing: 0.03em; text-transform: uppercase; font-size: 8px; }
.stamp-item .del-s {
  color: var(--gray4); font-size: 11px; cursor: pointer;
  transition: color 0.12s; padding: 0 2px; line-height: 1;
}
.stamp-item .del-s:hover { color: var(--white); }
.empty-list { font-size: 9px; color: var(--gray4); letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 0; }

/* Buttons */
.btn {
  width: 100%; padding: 12px 14px; border: none;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
  text-transform: uppercase; cursor: pointer; transition: all 0.15s; font-weight: 500;
}
.btn-primary { background: var(--white); color: var(--black); }
.btn-primary:hover { background: var(--gray1); }
.btn-primary:disabled { background: var(--gray4); color: var(--gray3); cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--gray3); border-top: var(--line); }
.btn-ghost:hover { color: var(--white); background: var(--gray5); }
.btn-add { background: transparent; color: var(--gray2); border: var(--line); }
.btn-add:hover { background: var(--gray5); color: var(--white); }
.btn-add:disabled { color: var(--gray4); cursor: not-allowed; }

/* Status */
.status { display: none; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 0; }
.status.error { display: block; color: var(--gray2); }
.status.success { display: flex; align-items: center; gap: 8px; color: var(--gray2); }
.status.loading { display: flex; align-items: center; gap: 8px; color: var(--gray3); }
.spinner {
  width: 10px; height: 10px;
  border: 1px solid var(--gray4); border-top-color: var(--white);
  border-radius: 50%; animation: spin 0.9s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Panel footer (actions) */
.panel-footer { margin-top: auto; border-top: var(--line); flex-shrink: 0; }

/* ══════════════════════════
   RIGHT COLUMN — PREVIEW
══════════════════════════ */
.preview-area {
  background: var(--black);
  display: flex; flex-direction: column; overflow: hidden;
}

/* Top bar */
.page-bar {
  display: none;
  border-bottom: var(--line); flex-shrink: 0;
  align-items: center; padding: 0;
}
.page-bar-inner {
  display: flex; align-items: center;
  width: 100%; height: 44px;
}
.nav-btn {
  background: none; border: none; border-right: var(--line);
  color: var(--gray3); width: 44px; height: 44px;
  cursor: pointer; font-size: 18px; font-family: var(--mono);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; flex-shrink: 0;
}
.nav-btn:hover { background: var(--gray5); color: var(--white); }
.nav-btn:disabled { opacity: 0.2; cursor: default; }
.page-info {
  flex: 1; text-align: center; font-size: 9px; color: var(--gray3);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.del-page-btn {
  background: none; border: none; border-left: var(--line);
  color: var(--gray3); height: 44px; padding: 0 18px;
  font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em;
  text-transform: uppercase; cursor: pointer; transition: all 0.12s;
  white-space: nowrap; flex-shrink: 0;
}
.del-page-btn:hover { background: var(--gray5); color: var(--white); }
.restore-btn {
  background: none; border: none; border-left: var(--line);
  color: var(--white); height: 44px; padding: 0 18px;
  font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em;
  text-transform: uppercase; cursor: pointer; transition: all 0.12s;
  white-space: nowrap; flex-shrink: 0;
}

/* Canvas scroll */
.preview-scroll {
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  padding: 32px; overflow: auto;
}

.placeholder { margin: auto; text-align: center; }
.placeholder-cross {
  width: 48px; height: 48px; position: relative; margin: 0 auto 16px;
}
.placeholder-cross::before,
.placeholder-cross::after {
  content: ''; position: absolute; background: var(--gray4);
}
.placeholder-cross::before { width: 1px; height: 100%; left: 50%; top: 0; }
.placeholder-cross::after { height: 1px; width: 100%; top: 50%; left: 0; }
.placeholder p {
  font-size: 9px; color: var(--gray4); letter-spacing: 0.14em;
  text-transform: uppercase; line-height: 2;
}

.preview-wrapper {
  position: relative; display: none; flex-shrink: 0;
  box-shadow: 0 0 0 1px var(--gray4), 0 24px 60px rgba(0,0,0,0.7);
}
.deleted-overlay {
  position: absolute; inset: 0; background: rgba(10,10,10,0.55);
  display: none; align-items: center; justify-content: center;
  pointer-events: none; z-index: 5;
}
.deleted-overlay .del-label {
  font-family: var(--head); font-size: 13px; font-weight: 700;
  color: var(--white); letter-spacing: 0.3em; text-transform: uppercase;
  border: 1px solid var(--white); padding: 8px 18px;
  transform: rotate(-8deg);
}
#pdfCanvas { display: block; }

.stamp-el {
  position: absolute; cursor: grab; user-select: none;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6)); touch-action: none;
}
.stamp-el:active { cursor: grabbing; }
.stamp-el img { width: 100%; height: 100%; pointer-events: none; display: block; }
.stamp-el .remove-stamp {
  position: absolute; top: -8px; right: -8px;
  background: var(--white); color: var(--black); border: none;
  width: 18px; height: 18px; font-size: 9px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 500;
}

/* ══════════════════════════
   MOBILE ≤ 680px
══════════════════════════ */
@media (max-width: 680px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .preview-area { grid-row: 1; }
  .preview-scroll { padding: 12px; }

  .panel {
    grid-row: 2;
    border-right: none; border-top: var(--line);
    max-height: 52px;
    transition: max-height 0.3s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  .panel.open { max-height: 72vh; overflow-y: auto; }

  .mobile-bar {
    display: flex; align-items: center; height: 52px;
    border-bottom: var(--line); padding: 0; flex-shrink: 0; cursor: pointer;
  }
  .mobile-bar-title {
    flex: 1; padding: 0 16px;
    font-size: 9px; color: var(--gray3);
    letter-spacing: 0.1em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mobile-action {
    border: none; border-left: var(--line);
    background: none; color: var(--gray3);
    height: 52px; padding: 0 14px;
    font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em;
    text-transform: uppercase; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: all 0.12s;
  }
  .mobile-action:hover, .mobile-action:active { background: var(--gray5); color: var(--white); }
  .mobile-action.accent { color: var(--white); }
  .mobile-action:disabled { opacity: 0.3; cursor: not-allowed; }

  .panel-header { display: none; }
  .desktop-only { display: none !important; }
  .section { padding: 14px 16px; }
  .panel-footer { margin-top: 0; }
}
@media (min-width: 681px) {
  .mobile-only { display: none !important; }
  .mobile-bar { display: none; }
}
</style>
</head>
<body>
<div class="app">

<!-- ══ PREVIEW ══════════════════════ -->
<div class="preview-area">
  <div class="page-bar" id="pageBar">
    <div class="page-bar-inner">
      <button class="nav-btn" id="prevBtn" onclick="goPage(-1)">&#8249;</button>
      <button class="nav-btn" id="nextBtn" onclick="goPage(1)" style="border-right:var(--line)">&#8250;</button>
      <div class="page-info" id="pageInfo">— / —</div>
      <button class="del-page-btn" id="delPageBtn" onclick="toggleDeletePage()">Удалить страницу</button>
    </div>
  </div>

  <div class="preview-scroll" id="previewScroll">
    <div class="placeholder" id="placeholder">
      <div class="placeholder-cross"></div>
      <p>Загрузите документ<br>чтобы увидеть превью</p>
    </div>
    <div class="preview-wrapper" id="previewWrapper">
      <canvas id="pdfCanvas"></canvas>
      <div class="deleted-overlay" id="deletedOverlay">
        <div class="del-label">Удалено</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ PANEL ════════════════════════ -->
<div class="panel" id="panel">

  <!-- Mobile bar -->
  <div class="mobile-bar" onclick="toggleSheet()">
    <div class="mobile-bar-title" id="mobileTitle">Загрузите файл</div>
    <button class="mobile-action" onclick="event.stopPropagation();document.getElementById('fileInputMobile').click()">Файл</button>
    <button class="mobile-action" id="mobileAddBtn" onclick="event.stopPropagation();addStampToPage()" disabled>+ Печать</button>
    <button class="mobile-action accent" id="mobileApplyBtn" onclick="event.stopPropagation();applyAll()" disabled>Скачать</button>
  </div>
  <input type="file" id="fileInputMobile" accept=".docx" class="mobile-only" style="display:none">

  <!-- Wordmark -->
  <div class="panel-header desktop-only">
    <div class="wordmark">Stamp</div>
    <div class="tagline">Document seal tool</div>
  </div>

  <!-- Upload -->
  <div class="section desktop-only">
    <div class="section-label">Документ</div>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".docx">
      <div class="drop-arrow">↑</div>
      <div class="drop-text">Перетащите или <b>выберите .docx</b></div>
      <div class="fname" id="fileName"></div>
    </div>
  </div>

  <!-- Stamp select -->
  <div class="section">
    <div class="section-label">Печать</div>
    <div class="stamps-grid">
      {% for key, stamp in stamps.items() %}
      <label class="stamp-opt">
        <input type="radio" name="stamp" value="{{ key }}" {% if loop.first %}checked{% endif %}>
        <div class="stamp-card">
          <img src="/stamp_image/{{ key }}" alt="{{ stamp.label }}">
          <div class="nm">{{ stamp.label }}</div>
        </div>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Size -->
  <div class="section">
    <div class="section-label">Размер</div>
    <div class="slider-row">
      <input type="range" id="sizeSlider" min="8" max="40" value="20" oninput="onSizeChange(this.value)">
      <span class="sval" id="sizeVal">20%</span>
    </div>
  </div>

  <!-- Add (desktop) -->
  <div class="section desktop-only">
    <button class="btn btn-add" id="addStampBtn" onclick="addStampToPage()" disabled>
      + Добавить печать
    </button>
  </div>

  <!-- Stamp list -->
  <div class="section" style="flex:1">
    <div class="section-label">Печати на документе</div>
    <div class="stamp-list" id="stampList">
      <div class="empty-list">Нет</div>
    </div>
    <div id="statusEl" class="status" style="margin-top:10px"></div>
  </div>

  <!-- Footer actions -->
  <div class="panel-footer desktop-only">
    <button class="btn btn-primary" id="applyBtn" onclick="applyAll()" disabled>Скачать PDF</button>
    <button class="btn btn-ghost" id="resetBtn" onclick="resetAll()" style="display:none">Другой файл</button>
  </div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const isMobile = () => window.innerWidth <= 680;
let jobId=null, currentFilename='', pdfDoc=null;
let currentPage=1, totalPages=0;
let deletedPages=new Set(), stampsList=[], stampIdCounter=0;
let pageWidth=0, pageHeight=0, renderScale=1;

const $=id=>document.getElementById(id);
const fileInput=$('fileInput'), fileInputMobile=$('fileInputMobile');
const dropZone=$('dropZone'), fileName=$('fileName');
const placeholder=$('placeholder'), previewWrapper=$('previewWrapper');
const pdfCanvas=$('pdfCanvas'), pageBar=$('pageBar');
const pageInfo=$('pageInfo'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn');
const delPageBtn=$('delPageBtn'), deletedOverlay=$('deletedOverlay');
const addStampBtn=$('addStampBtn'), stampListEl=$('stampList');
const applyBtn=$('applyBtn'), resetBtn=$('resetBtn'), statusEl=$('statusEl');
const mobileTitle=$('mobileTitle'), mobileAddBtn=$('mobileAddBtn'), mobileApplyBtn=$('mobileApplyBtn');
const panel=$('panel');

// Sheet
function toggleSheet() {
  if (!isMobile()) return;
  panel.classList.toggle('open');
}

// File inputs
fileInput && fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) handleFile(fileInput.files[0]); });
fileInputMobile && fileInputMobile.addEventListener('change', ()=>{ if(fileInputMobile.files[0]) handleFile(fileInputMobile.files[0]); });
if (dropZone) {
  ['dragover','dragleave','drop'].forEach(evt=>{
    dropZone.addEventListener(evt, e=>{
      e.preventDefault();
      if(evt==='dragover') dropZone.classList.add('dragover');
      else dropZone.classList.remove('dragover');
      if(evt==='drop'&&e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  });
}

async function handleFile(file) {
  if (!file.name.endsWith('.docx')) { showStatus('error', 'Нужен файл .docx'); return; }
  currentFilename = file.name.replace('.docx','');
  if (fileName) { fileName.textContent=file.name; fileName.style.display='block'; }
  if (mobileTitle) mobileTitle.textContent = file.name.length>22 ? file.name.slice(0,22)+'…' : file.name;
  showStatus('loading','Конвертирую...');
  setDis(true);
  const fd=new FormData(); fd.append('docx',file);
  try {
    const resp=await fetch('/convert',{method:'POST',body:fd});
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.error);
    jobId=data.job_id; totalPages=data.page_count; currentPage=1;
    deletedPages=new Set(); stampsList.forEach(s=>s.el.remove()); stampsList=[];
    showStatus('',''); pdfDoc=null;
    await renderPage(currentPage);
    pageBar.style.display='flex'; placeholder.style.display='none'; previewWrapper.style.display='block';
    setDis(false); if(resetBtn) resetBtn.style.display='block';
    updatePageUI(); renderStampList();
    if(isMobile()) panel.classList.remove('open');
  } catch(e) { showStatus('error',e.message); setDis(false); }
}

function setDis(d) {
  const dis=d||!jobId;
  [applyBtn,addStampBtn,mobileApplyBtn,mobileAddBtn].forEach(el=>{ if(el) el.disabled=dis; });
}

async function renderPage(num) {
  if (!pdfDoc) pdfDoc=await pdfjsLib.getDocument(`/preview_pdf/${jobId}`).promise;
  const page=await pdfDoc.getPage(num);
  const vp=page.getViewport({scale:1});
  pageWidth=vp.width; pageHeight=vp.height;
  const scroll=$('previewScroll');
  const avW=scroll.clientWidth-(isMobile()?24:64);
  const avH=scroll.clientHeight-(isMobile()?24:64);
  renderScale=Math.min(avW/pageWidth, avH/pageHeight, isMobile()?2:1.8);
  const sv=page.getViewport({scale:renderScale});
  pdfCanvas.width=sv.width; pdfCanvas.height=sv.height;
  await page.render({canvasContext:pdfCanvas.getContext('2d'),viewport:sv}).promise;
  deletedOverlay.style.display=deletedPages.has(num)?'flex':'none';
  refreshStamps();
}

function updatePageUI() {
  pageInfo.textContent=`${currentPage} / ${totalPages}`;
  prevBtn.disabled=currentPage<=1; nextBtn.disabled=currentPage>=totalPages;
  const isDel=deletedPages.has(currentPage);
  delPageBtn.textContent=isDel?'Восстановить':'Удалить страницу';
  delPageBtn.className=isDel?'restore-btn':'del-page-btn';
}

async function goPage(dir) {
  const n=currentPage+dir;
  if(n<1||n>totalPages) return;
  currentPage=n; updatePageUI(); await renderPage(currentPage);
}

function toggleDeletePage() {
  if(deletedPages.has(currentPage)) deletedPages.delete(currentPage);
  else deletedPages.add(currentPage);
  updatePageUI();
  deletedOverlay.style.display=deletedPages.has(currentPage)?'flex':'none';
  renderStampList();
}

function getStamp() { return document.querySelector('input[name=stamp]:checked').value; }

function onSizeChange(val) {
  $('sizeVal').textContent=val+'%';
  const size=parseFloat(val), cw=pdfCanvas.clientWidth||pdfCanvas.width;
  stampsList.filter(s=>s.page===currentPage).forEach(s=>{ s.el.style.width=(cw*size/100)+'px'; s.size=size; });
  const sl=$('sizeSlider');
  sl.style.setProperty('--pct',((val-sl.min)/(sl.max-sl.min)*100).toFixed(1)+'%');
}

function addStampToPage() {
  if (!jobId) return;
  const stampKey=getStamp(), size=parseFloat($('sizeSlider').value), id=++stampIdCounter;
  const cw=pdfCanvas.clientWidth||pdfCanvas.width, ch=pdfCanvas.clientHeight||pdfCanvas.height;
  const sw=cw*(size/100);
  const el=createStampEl(id,stampKey,sw);
  previewWrapper.appendChild(el);
  el.style.left=((cw-sw)/2)+'px'; el.style.top=(ch*0.68)+'px';
  stampsList.push({id,page:currentPage,stamp:stampKey,el,size});
  refreshStamps(); renderStampList();
  if(isMobile()) panel.classList.remove('open');
}

function createStampEl(id,stampKey,sw) {
  const el=document.createElement('div');
  el.className='stamp-el'; el.dataset.id=id;
  el.style.cssText=`width:${sw}px;height:auto;display:block;`;
  const img=document.createElement('img');
  img.src=`/stamp_image/${stampKey}?t=${Date.now()}`; el.appendChild(img);
  const rm=document.createElement('button');
  rm.className='remove-stamp'; rm.innerHTML='&#x2715;';
  rm.addEventListener('click',e=>{e.stopPropagation();removeStamp(id);});
  el.appendChild(rm); makeDraggable(el); return el;
}

function removeStamp(id) {
  const idx=stampsList.findIndex(s=>s.id===id);
  if(idx===-1) return;
  stampsList[idx].el.remove(); stampsList.splice(idx,1); renderStampList();
}

function refreshStamps() {
  stampsList.forEach(s=>{ s.el.style.display=s.page===currentPage?'block':'none'; });
}

function renderStampList() {
  const L={ {% for key, stamp in stamps.items() %}'{{ key }}':'{{ stamp.label }}',{% endfor %} };
  if(!stampsList.length) { stampListEl.innerHTML='<div class="empty-list">Нет</div>'; return; }
  stampListEl.innerHTML='';
  stampsList.forEach(s=>{
    const div=document.createElement('div'); div.className='stamp-item';
    const isDel=deletedPages.has(s.page);
    div.innerHTML=`<span class="pg">${s.page}</span><span class="nm" style="${isDel?'opacity:.3;text-decoration:line-through':''}">${L[s.stamp]||s.stamp}</span><span class="del-s">&#x2715;</span>`;
    div.querySelector('.del-s').addEventListener('click',e=>{e.stopPropagation();removeStamp(s.id);});
    div.addEventListener('click',()=>goToPage(s.page));
    stampListEl.appendChild(div);
  });
}

async function goToPage(n) { if(n===currentPage) return; currentPage=n; updatePageUI(); await renderPage(n); }

function makeDraggable(el) {
  let drag=false,ox=0,oy=0;
  const start=(cx,cy)=>{ drag=true; const r=el.getBoundingClientRect(); ox=cx-r.left; oy=cy-r.top; };
  const move=(cx,cy)=>{ if(!drag) return; const wr=previewWrapper.getBoundingClientRect(); el.style.left=Math.max(0,Math.min(cx-wr.left-ox,wr.width-el.offsetWidth))+'px'; el.style.top=Math.max(0,Math.min(cy-wr.top-oy,wr.height-el.offsetHeight))+'px'; };
  el.addEventListener('mousedown',e=>{ if(e.target.classList.contains('remove-stamp')) return; start(e.clientX,e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  document.addEventListener('mouseup',()=>{ drag=false; });
  el.addEventListener('touchstart',e=>{ if(e.target.classList.contains('remove-stamp')) return; const t=e.touches[0]; start(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  document.addEventListener('touchmove',e=>{ if(!drag) return; move(e.touches[0].clientX,e.touches[0].clientY); e.preventDefault(); },{passive:false});
  document.addEventListener('touchend',()=>{ drag=false; });
}

async function applyAll() {
  if (!jobId) return;
  const cr=pdfCanvas.getBoundingClientRect(), cw=cr.width, ch=cr.height;
  const stamps=stampsList.map(s=>{ const sr=s.el.getBoundingClientRect(); return {page:s.page,stamp:s.stamp,x:((sr.left-cr.left)/cw)*100,y:((sr.top-cr.top)/ch)*100,size:s.size}; });
  showStatus('loading','Генерирую PDF...');
  [applyBtn,mobileApplyBtn].forEach(el=>{ if(el) el.disabled=true; });
  try {
    const resp=await fetch('/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:jobId,stamps,deleted_pages:Array.from(deletedPages),filename:currentFilename})});
    const data=await resp.json();
    if(!resp.ok) throw new Error(data.error);
    const a=document.createElement('a'); a.href=data.download_url; a.download=currentFilename+'_с_печатью.pdf'; a.click();
    showStatus('success','PDF скачивается');
  } catch(e) { showStatus('error',e.message); }
  finally { [applyBtn,mobileApplyBtn].forEach(el=>{ if(el) el.disabled=false; }); }
}

function resetAll() {
  jobId=null; currentFilename=''; pdfDoc=null; currentPage=1; totalPages=0; deletedPages=new Set();
  stampsList.forEach(s=>s.el.remove()); stampsList=[];
  if(fileInput) fileInput.value=''; if(fileInputMobile) fileInputMobile.value='';
  if(fileName) fileName.style.display='none';
  if(mobileTitle) mobileTitle.textContent='Загрузите файл';
  placeholder.style.display='block'; previewWrapper.style.display='none'; pageBar.style.display='none';
  setDis(true); if(resetBtn) resetBtn.style.display='none';
  showStatus('',''); renderStampList();
}

function showStatus(type,msg) {
  statusEl.className='status'; statusEl.innerHTML='';
  if(!type||!msg){statusEl.style.display='none';return;}
  statusEl.classList.add(type);
  if(type==='loading'){statusEl.innerHTML=`<div class="spinner"></div><span>${msg}</span>`;statusEl.style.display='flex';}
  else{statusEl.textContent=msg;statusEl.style.display=type==='success'?'flex':'block';}
}

onSizeChange(20);
</script>
</body>
